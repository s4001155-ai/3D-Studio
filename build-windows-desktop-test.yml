name: Build 3D Studio Windows Desktop Import Test 5.3.2
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Python gateway
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --clean --noconfirm --onefile --name studio-gateway --distpath app/dist app/serve.py
      - name: Verify local gateway
        run: node scripts/verify-gateway.cjs
      - name: Install Electron
        run: npm install
      - name: Package Windows installer
        run: npm run dist:win
      - name: Verify packaged server and UI
        shell: pwsh
        run: |
          if (!(Test-Path "dist/win-unpacked/resources/studio-gateway.exe")) { throw "Gateway not packaged" }
          if (!(Test-Path "dist/win-unpacked/resources/web/index.html")) { throw "Editor not packaged" }
      - uses: actions/upload-artifact@v4
        with:
          name: 3D-Studio-Windows-5.3.2-Desktop-Test
          path: dist/*.exe
          if-no-files-found: error
