
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        shell: pwsh
        run: npm run dist:win

      - name: Find and prepare installers
        shell: pwsh
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "Searching for installers..."

          $files = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter "*.exe" |
            Where-Object {
              $_.FullName -match "dist" -and
              $_.FullName -notmatch "win-unpacked" -and
              $_.FullName -notmatch "node_modules"
            })

          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\upload" | Out-Null

          foreach ($file in $files) {
            Write-Host "Found: $($file.FullName)"
            Copy-Item -LiteralPath $file.FullName -Destination "$env:GITHUB_WORKSPACE\upload" -Force
          }

          if ($files.Count -eq 0) {
            throw "No installers found."
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Studio-Windows-Installers
          path: ${{ github.workspace }}/upload/*.exe
          if-no-files-found: error
