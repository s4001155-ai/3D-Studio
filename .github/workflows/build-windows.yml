
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build installer and portable EXE
        shell: pwsh
        run: |
          npx electron-builder --win nsis portable --x64 --publish never
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Check generated installers
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Recurse |
            Select-Object FullName

          $files = @(Get-ChildItem -Path dist -File -Filter "*.exe")

          if ($files.Count -eq 0) {
            throw "No installer or portable EXE was generated"
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Studio-Windows-Installers
          path: dist/*.exe
          if-no-files-found: error
