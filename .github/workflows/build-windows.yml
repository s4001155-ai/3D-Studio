
name: Build Windows EXE RC 5.3.1

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Python gateway
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m PyInstaller --clean --noconfirm --onefile --name studio-gateway --distpath app/dist app/serve.py
          if (!(Test-Path "app/dist/studio-gateway.exe")) {
            throw "Gateway EXE was not produced"
          }

      - name: Verify gateway before packaging
        run: node scripts/verify-gateway.cjs

      - name: Install Electron dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify packaged gateway exists
        shell: pwsh
        run: |
          $gateway = "dist/win-unpacked/resources/studio-gateway.exe"
          if (!(Test-Path $gateway)) {
            throw "Packaged gateway missing: $gateway"
          }
          Write-Host "Gateway successfully packaged"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Studio-Windows-5.3.1-RC
          path: dist/*Setup*.exe
          if-no-files-found: error
