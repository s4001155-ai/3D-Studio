
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        shell: pwsh
        run: |
          npm run dist:win
          if ($LASTEXITCODE -ne 0) {
            throw "Electron build failed"
          }

      - name: Prepare EXE files
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path "dist" -Recurse -File -Filter "*.exe" |
            Where-Object {
              $_.FullName -notmatch "win-unpacked"
            })

          Write-Host "Found EXE files: $($files.Count)"
          $files | ForEach-Object {
            Write-Host $_.FullName
          }

          if ($files.Count -eq 0) {
            throw "No installer or portable EXE was generated."
          }

          New-Item -ItemType Directory -Force -Path "upload" | Out-Null

          foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination "upload" -Force
          }

          Get-ChildItem "upload" -File

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Studio-Windows-Installers
          path: upload/*.exe
          if-no-files-found: error
