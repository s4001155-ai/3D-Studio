name: Build macOS App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS for Apple Silicon and Intel
    # Intel macOS runner; cross-packages Electron for both CPU architectures.
    # Avoids the separate macOS arm64 runner queue.
    runs-on: macos-14
    timeout-minutes: 70
    steps:
      - name: Check out 3D Studio
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify local Three.js assets
        run: |
          test -f src/vendor/three.module.js
          test -d src/vendor/addons

      - name: Build macOS DMG and ZIP for M1/M2 and Intel
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never

      - name: Verify installers
        shell: bash
        run: |
          ls -lah dist
          for arch in arm64 x64; do
            find dist -maxdepth 1 -type f -name "*${arch}*.dmg" | grep -q . || { echo "Missing ${arch} DMG"; exit 1; }
            find dist -maxdepth 1 -type f -name "*${arch}*.zip" | grep -q . || { echo "Missing ${arch} ZIP"; exit 1; }
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Studio-macOS-Apple-Silicon-and-Intel
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
