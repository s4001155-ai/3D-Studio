name: Build macOS App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (Intel + Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Check 3D assets
        run: |
          test -f src/vendor/three.module.js
          test -d src/vendor/addons

      - name: Build unsigned Intel and Apple Silicon packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ''
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never

      - name: Check both architectures
        shell: bash
        run: |
          ls -lah dist
          for arch in x64 arm64; do
            find dist -maxdepth 1 -type f -name "*${arch}*.dmg" | grep -q . || { echo "Missing ${arch} DMG"; exit 1; }
            find dist -maxdepth 1 -type f -name "*${arch}*.zip" | grep -q . || { echo "Missing ${arch} ZIP"; exit 1; }
          done

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Studio-macOS-Intel-and-Apple-Silicon
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
