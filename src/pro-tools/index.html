<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Studio — Special & Pro Tools</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1625;color:#eef6ff;font:14px system-ui}header{height:64px;display:flex;align-items:center;gap:12px;padding:0 18px;background:#14253a;border-bottom:1px solid #395571}h1{font-size:18px;margin:0}header small{color:#a5b9d1}main{height:calc(100vh - 64px);display:grid;grid-template-columns:258px minmax(0,1fr)}aside{background:#15263a;border-right:1px solid #3b5572;overflow:auto;padding:12px}button{font:inherit;cursor:pointer}aside>button{width:100%;padding:11px;margin-bottom:8px;border-radius:8px;color:#eaf6ff;background:#263d56;border:1px solid #456586;text-align:left}aside>button.active{background:#236394;border-color:#7ec9fa}#items{display:grid;gap:5px;margin-top:12px}#items button{width:100%;text-align:left;padding:10px;border:1px solid transparent;border-radius:8px;color:#dce9f7;background:transparent}#items button:hover,#items button.selected{background:#29465f;border-color:#6284a5}#items small{display:block;color:#a9c2d9;margin-top:4px}#stage{position:relative}iframe{width:100%;height:100%;border:0;background:#0c1625}#guide{display:none;position:fixed;inset:0;background:#000b;z-index:1000;align-items:center;justify-content:center;padding:20px}#guide article{background:#20354c;max-width:520px;border:1px solid #7693b1;border-radius:14px;padding:24px;box-shadow:0 20px 60px #0009}#guide p{line-height:1.6;color:#d0e1f2}#guide button{padding:10px 18px;background:#3278a9;color:white;border:0;border-radius:7px}#tip{padding:10px;color:#a9bfd5;line-height:1.5}@media(max-width:700px){main{grid-template-columns:180px minmax(0,1fr)}header small{display:none}}</style></head><body>
<header><h1>◈ 3D Studio</h1><small>Advanced Tools Lab · Experimental builds</small><a href="../index.html" style="margin-left:auto;color:#aee0ff;font:14px system-ui">← Main editor</a></header>
<main><aside><button id="special" class="active">🧰 Special Tools (Simple)</button><button id="pro">⚙ Pro Tools (Advanced)</button><div id="tip">Правая кнопка мыши по названию инструмента — подробный гайд.</div><div id="items"></div></aside><section id="stage"><iframe id="editor" title="3D Studio editor" src="09-print-analyzer.html"></iframe></section></main>
<div id="guide"><article><h2 id="guideTitle"></h2><p id="guideText"></p><p><strong>Экспериментальная функция:</strong> сохраняй резервные копии и проверяй STL в слайсере перед печатью.</p><button id="guideClose">Закрыть</button></article></div>
<script>const entries=[["09-print-analyzer.html", "Print Analyzer Pro", "Простая подсветка участков без опоры", "Нажми Show support suggestions. Красными точками отмечаются потенциально неподдерживаемые участки с учётом соседних объектов и предыдущего слоя. Никакие поддержки автоматически не создаются."], ["01-shell.html", "Shell", "Создание полых коробок", "Создаёт открытую коробку с регулируемой толщиной стенок. Пока не работает с произвольной геометрией."], ["02-pattern.html", "Smart Pattern", "Повторение деталей", "Выдели объект, выбери число копий и шаг. Линейные или круговые массивы без объединения геометрии."], ["03-face-sketch.html", "Face Sketch", "Выступ на грани", "Задай ширину, высоту и глубину, затем нажми Pick face и щёлкни по поверхности. Получится отдельный выступ."], ["04-smart-dimensions.html", "Smart Dimensions", "Размеры по формулам", "Задай W, а H и D введи выражениями вроде W/2 или W+10. Создаёт новую коробку."], ["05-thread.html", "Thread Generator", "Винтовой профиль", "Задай диаметр, длину и шаг. Это визуальная резьба, не стандарт ISO и не проверенная печатная резьба."], ["06-loft.html", "Loft", "Переход между профилями", "Задай прямоугольное основание, радиус круга сверху и высоту. Создаётся переходная геометрия."], ["07-sweep.html", "Sweep", "Трубка по траектории", "Задай радиус трубки, размах и подъём. Траектория пока фиксированная и открытые торцы не закрываются."], ["08-assembly.html", "Assembly Tools", "Проверка сборки", "Создай несколько объектов и проверь приблизительные пересечения по габаритам. Это не точный физический расчёт."], ["10-history.html", "Design History", "Снимки истории", "Сохраняй снимки состояния сцены и возвращайся к ним. Пока без пересчёта параметрических операций."]];let tab='special',current=entries[0][0];const items=document.getElementById('items'),frame=document.getElementById('editor');function render(){items.replaceChildren();document.getElementById('special').classList.toggle('active',tab==='special');document.getElementById('pro').classList.toggle('active',tab==='pro');(tab==='special'?entries.slice(0,1):entries.slice(1)).forEach(([file,name,summary,guide])=>{const b=document.createElement('button');b.className=file===current?'selected':'';b.innerHTML='<strong>'+name+'</strong><small>'+summary+'</small>';b.onclick=()=>{current=file;frame.src=file;render()};b.oncontextmenu=e=>{e.preventDefault();document.getElementById('guideTitle').textContent=name;document.getElementById('guideText').textContent=guide;document.getElementById('guide').style.display='flex'};items.appendChild(b)})}document.getElementById('special').onclick=()=>{tab='special';render()};document.getElementById('pro').onclick=()=>{tab='pro';render()};document.getElementById('guideClose').onclick=()=>document.getElementById('guide').style.display='none';document.getElementById('guide').onclick=e=>{if(e.target.id==='guide')e.currentTarget.style.display='none'};render();</script></body></html>
